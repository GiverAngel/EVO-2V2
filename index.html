<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Viskan Ligan — Stängt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #e60023;
      --red-light: #ff2148;
      --black: #090909;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      color: var(--black);
      font-family: "Rajdhani", sans-serif;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(230, 0, 35, 0.09),
          transparent 42%
        ),
        linear-gradient(135deg, #ffffff, #fff5f6, #ffffff);
    }

    /* Floating background triangles */
    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .triangle {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 35px solid var(--red);
      opacity: 0.12;
      animation: float 16s linear infinite;
    }

    .triangle:nth-child(1) {
      left: 10%;
      animation-duration: 18s;
    }

    .triangle:nth-child(2) {
      left: 28%;
      animation-duration: 24s;
      animation-delay: -8s;
    }

    .triangle:nth-child(3) {
      left: 72%;
      animation-duration: 20s;
      animation-delay: -5s;
    }

    .triangle:nth-child(4) {
      left: 90%;
      animation-duration: 25s;
      animation-delay: -12s;
    }

    @keyframes float {
      from {
        transform: translateY(110vh) rotate(0deg);
      }
      to {
        transform: translateY(-20vh) rotate(360deg);
      }
    }

    .closure {
      width: min(650px, 100%);
      text-align: center;
      animation: appear 1s ease-out both;
    }

    /* Animal and question mark */
    .mascot {
      position: relative;
      width: 190px;
      height: 225px;
      margin: 0 auto 25px;
      animation: bob 3s ease-in-out infinite;
    }

    .question {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: 4.5rem;
      font-weight: 800;
      text-shadow: 0 0 20px rgba(230, 0, 35, 0.3);
      animation: question 2s ease-in-out infinite;
      z-index: 2;
    }

    /* Cartoon fox head */
    .fox-head {
      position: absolute;
      top: 65px;
      left: 35px;
      width: 120px;
      height: 105px;
      background: #e88a35;
      border: 4px solid var(--black);
      border-radius: 48% 48% 43% 43%;
      z-index: 1;
    }

    .ear {
      position: absolute;
      top: -29px;
      width: 42px;
      height: 57px;
      background: #e88a35;
      border: 4px solid var(--black);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      border-radius: 8px;
    }

    .ear.left {
      left: 2px;
      transform: rotate(-13deg);
    }

    .ear.right {
      right: 2px;
      transform: rotate(13deg);
    }

    .inner-ear {
      position: absolute;
      top: 12px;
      left: 11px;
      width: 14px;
      height: 30px;
      background: #ffb4b4;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .eye {
      position: absolute;
      top: 39px;
      width: 10px;
      height: 14px;
      background: var(--black);
      border-radius: 50%;
    }

    .eye.left {
      left: 29px;
    }

    .eye.right {
      right: 29px;
    }

    .muzzle {
      position: absolute;
      left: 24px;
      bottom: 8px;
      width: 64px;
      height: 39px;
      background: #fff1dc;
      border: 3px solid var(--black);
      border-radius: 50%;
    }

    .nose {
      position: absolute;
      left: 51px;
      bottom: 34px;
      width: 13px;
      height: 10px;
      background: var(--black);
      border-radius: 50%;
      z-index: 2;
    }

    .mouth {
      position: absolute;
      left: 55px;
      bottom: 22px;
      width: 3px;
      height: 12px;
      background: var(--black);
      z-index: 2;
    }

    .body-shirt {
      position: absolute;
      left: 50px;
      top: 158px;
      width: 90px;
      height: 58px;
      background: var(--white);
      border: 4px solid var(--black);
      border-radius: 15px 15px 8px 8px;
      z-index: 0;
    }

    .shirt-stripe {
      position: absolute;
      left: 36px;
      top: 0;
      width: 10px;
      height: 50px;
      background: var(--red);
    }

    .arm {
      position: absolute;
      top: 166px;
      width: 23px;
      height: 48px;
      background: #e88a35;
      border: 4px solid var(--black);
      border-radius: 15px;
    }

    .arm.left {
      left: 29px;
      transform: rotate(15deg);
    }

    .arm.right {
      right: 29px;
      transform: rotate(-15deg);
    }

    .league-title {
      margin: 0;
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.7rem, 7vw, 3.4rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(230, 0, 35, 0.2);
    }

    .divider {
      width: 85px;
      height: 4px;
      margin: 22px auto;
      border-radius: 10px;
      background: var(--red);
      box-shadow: 0 0 14px rgba(230, 0, 35, 0.4);
    }

    .message {
      margin: 0 auto;
      max-width: 540px;
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
      font-weight: 700;
      line-height: 1.6;
      color: #292929;
    }

    .message strong {
      color: var(--red);
    }

    .year {
      display: inline-block;
      margin-top: 25px;
      padding: 9px 19px;
      border: 1px solid rgba(230, 0, 35, 0.3);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    footer {
      position: absolute;
      bottom: 18px;
      left: 12px;
      right: 12px;
      color: #777;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-align: center;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes question {
      0%, 100% {
        transform: translateX(-50%) rotate(-8deg);
      }
      50% {
        transform: translateX(-50%) rotate(8deg) translateY(-5px);
      }
    }

    @media (max-width: 480px) {
      .mascot {
        transform: scale(0.9);
        margin-bottom: 12px;
      }

      .message {
        line-height: 1.5;
      }

      footer {
        font-size: 0.7rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="particles" aria-hidden="true">
    <span class="triangle"></span>
    <span class="triangle"></span>
    <span class="triangle"></span>
    <span class="triangle"></span>
  </div>

  <main class="closure">
    <div class="mascot" role="img" aria-label="En räv med ett frågetecken ovanför huvudet">
      <div class="question">?</div>

      <div class="fox-head">
        <div class="ear left">
          <div class="inner-ear"></div>
        </div>
        <div class="ear right">
          <div class="inner-ear"></div>
        </div>

        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="muzzle"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>

      <div class="body-shirt">
        <div class="shirt-stripe"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>
    </div>

    <h1 class="league-title">Viskan Ligan</h1>

    <div class="divider"></div>

    <p class="message">
      Inget finns här längre.<br>
      <strong>Viskan Ligan har stängt för året 2026 permanent.</strong><br>
      Tack!
    </p>

    <div class="year">2026 • SLUT FÖR I ÅR</div>
  </main>

  <footer>
    VISKAN LIGAN • TACK FÖR ALLT
  </footer>
</body>
</html>
